version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: qr_platform_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./backend
    container_name: qr_platform_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/qr_advertising_platform
      - JWT_SECRET=super_secret_jwt_key_qr_advertising_2026_antigravity
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: qr_platform_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://192.168.1.23:5173/

volumes:
  mongodb_data:
